<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Orbitron:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 設定カードとゲーム画面の2画面。ゲーム画面は上段に HOLD / スコア / NEXT、中央に盤面、下段に操作ボタン。
   ブロックの柄を選ぶと、配色・背景・フォント・盤面の背景がまとめて切り替わる。 */
:root {
  color-scheme: dark;
  --bg: #121214; --bg-img: none; --bg-size: auto; --bg-pos: 0 0;
  --panel: #1e1e24; --panel2: #15151a; --line: #2a2a35;
  --text: #f3f4f6; --muted: #9aa0ad;
  --accent: #00adb5; --accent-ink: #04141a;
  --btn: #2d2d35; --btn-ink: #f3f4f6;
  --gold: #ffaa00;
  --overlay: rgba(10, 10, 12, 0.92);
  --board-edge: #3a3a45;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  --glow: none; --glow-box: none;
  --font: 'DotGothic16', 'Zen Maru Gothic', sans-serif;
  --num: 'DotGothic16', 'Zen Maru Gothic', monospace;
}
:root[data-style="sweets"] {
  color-scheme: light;
  --bg: #ffe6ee;
  --bg-img: radial-gradient(circle, rgba(255,255,255,0.95) 0 7px, transparent 8px), radial-gradient(circle, rgba(255,196,213,0.6) 0 5px, transparent 6px);
  --bg-size: 56px 56px, 56px 56px; --bg-pos: 0 0, 28px 28px;
  --panel: #fff8fb; --panel2: #ffffff; --line: #ffbfd2;
  --text: #6b3a4a; --muted: #a2607a;
  --accent: #d63d73; --accent-ink: #ffffff;
  --btn: #ffe0ea; --btn-ink: #8a3354;
  --gold: #b45f08;
  --overlay: rgba(255, 238, 244, 0.94);
  --board-edge: #ffb3c9;
  --shadow: 0 8px 24px rgba(214, 61, 115, 0.2);
  --font: 'Zen Maru Gothic', sans-serif;
  --num: 'Zen Maru Gothic', sans-serif;
}
:root[data-style="neon"] {
  color-scheme: dark;
  --bg: #05060f;
  --bg-img: radial-gradient(ellipse at 50% -10%, rgba(120, 40, 200, 0.38), transparent 60%), linear-gradient(rgba(0,245,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,245,255,0.05) 1px, transparent 1px);
  --bg-size: auto, 32px 32px, 32px 32px; --bg-pos: 0 0, 0 0, 0 0;
  --panel: #0b0d1f; --panel2: #070816; --line: #27327a;
  --text: #e8f6ff; --muted: #8a97c9;
  --accent: #00f5ff; --accent-ink: #021014;
  --btn: #141a3d; --btn-ink: #b8f8ff;
  --gold: #ffd166;
  --overlay: rgba(3, 4, 12, 0.9);
  --board-edge: #00f5ff;
  --shadow: 0 0 24px rgba(0, 245, 255, 0.22);
  --glow: 0 0 12px rgba(0, 245, 255, 0.7); --glow-box: 0 0 18px rgba(0, 245, 255, 0.45);
  --font: 'Orbitron', 'Zen Maru Gothic', sans-serif;
  --num: 'Orbitron', 'Zen Maru Gothic', sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center;
  background-color: var(--bg); background-image: var(--bg-img);
  background-size: var(--bg-size); background-position: var(--bg-pos);
  color: var(--text); font-family: var(--font);
  overflow-y: auto; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 設定画面 ---------- */
#setup {
  margin: auto; width: 100%; max-width: 420px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
  padding: 22px 20px; box-shadow: var(--shadow);
}
#setup h1 { margin: 0 0 4px; font-size: 19px; line-height: 1.35; color: var(--accent); text-shadow: var(--glow); text-wrap: balance; }
.field { margin: 16px 0 0; }
label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
select {
  width: 100%; padding: 12px; font: inherit; font-size: 16px; border-radius: 10px;
  background: var(--btn); color: var(--btn-ink); border: 1px solid var(--line);
}
.hint { margin: 6px 0 0; min-height: 1.5em; font-size: 12px; color: var(--muted); }
#preview { display: block; margin: 10px auto 0; }
.primary {
  width: 100%; margin-top: 18px; padding: 14px; font-size: 17px; font-weight: 700;
  border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); box-shadow: var(--glow-box);
}
.ghost {
  padding: 11px 18px; font-size: 15px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--btn); color: var(--btn-ink);
}
.records { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; }
.records h2 { margin: 0 0 6px; font-size: 13px; color: var(--gold); }
.records dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.records dt { color: var(--muted); }
.records dd { margin: 0; font-family: var(--num); font-variant-numeric: tabular-nums; }
.note { margin: 12px 0 0; font-size: 11px; line-height: 1.6; color: var(--muted); }

/* ---------- ゲーム画面 ---------- */
#game { position: relative; width: 100%; max-width: 440px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
.topbar { display: flex; gap: 8px; align-items: stretch; }
.box {
  flex: none; width: 78px; padding: 5px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.box canvas { width: 64px; height: 64px; }
.lbl { font-size: 10px; letter-spacing: 0.12em; color: var(--muted); }
.stats { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat {
  min-width: 0; padding: 4px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  display: flex; flex-direction: column; justify-content: center;
}
.stat.wide { grid-column: 1 / -1; }
.stat b { font-family: var(--num); font-size: 19px; font-variant-numeric: tabular-nums; text-shadow: var(--glow); overflow-wrap: anywhere; }
.subbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
#mode-label { font-size: 12px; color: var(--muted); min-width: 0; }
.tools { display: flex; gap: 6px; flex: none; }
.tool { padding: 5px 12px; font-size: 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--btn); color: var(--btn-ink); }
.board-wrap { flex: 1 1 0; min-height: 0; padding: 3px; position: relative; }
/* 盤面は枠の中に重ねて置く。盤面の大きさで枠の大きさが変わらないようにするため */
#board { position: absolute; inset: 0; margin: auto; display: block; border-radius: 6px; box-shadow: 0 0 0 3px var(--board-edge); }
button.box { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
/* HOLD枠は点線の枠にして、押せる場所だとわかるようにする */
#hold-box { border-style: dashed; border-color: var(--accent); }
#hold-box:active { transform: scale(0.96); }

/* スマホの横向き: 盤面は縦と同じ10列×21段のまま、左右に情報を置く */
@media (orientation: landscape) and (max-height: 560px) {
  #game {
    max-width: none; display: grid; justify-content: center; gap: 8px 14px;
    grid-template-columns: 150px auto 150px; grid-template-rows: auto auto minmax(0, 1fr);
  }
  .topbar, .subbar { display: contents; }
  #hold-box { grid-column: 1; grid-row: 1; justify-self: end; }
  .stats { grid-column: 1; grid-row: 2 / 4; align-self: start; }
  #next-box { grid-column: 3; grid-row: 1; justify-self: start; }
  #mode-label { grid-column: 3; grid-row: 2; align-self: start; }
  .tools { grid-column: 3; grid-row: 3; align-self: start; flex-wrap: wrap; }
  #board-wrap { grid-column: 2; grid-row: 1 / 4; }
}

#overlay {
  position: absolute; inset: 0; z-index: 5; padding: 20px; border-radius: 16px;
  background: var(--overlay); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
#ov-title { margin: 0; font-size: 30px; color: var(--accent); text-shadow: var(--glow); text-wrap: balance; }
#ov-score { margin: 0; font-size: 15px; color: var(--muted); }
#ov-score b { color: var(--text); font-family: var(--num); font-variant-numeric: tabular-nums; }
#ov-sub { margin: 0; min-height: 1.4em; font-size: 14px; color: var(--gold); }
#ov-btns { display: flex; flex-direction: column; gap: 10px; width: min(260px, 100%); margin-top: 12px; }
#ov-btns .primary { margin-top: 0; }
</style>

<main id="setup">
  <h1>晴れときどきスイーツ</h1>

  <div class="field">
    <label for="mode">ゲームモード</label>
    <select id="mode">
      <option value="infinite" selected>無限モード(一定スピード)</option>
      <option value="accel">無限モード(だんだん加速)</option>
      <option value="stage">ステージモード(全5ステージ)</option>
    </select>
  </div>

  <div class="field">
    <label for="rule">ライン消去のあとの動き</label>
    <select id="rule">
      <option value="gravity" selected>ストン落下(浮いたブロックが落ちる・連鎖あり)</option>
      <option value="classic">通常ルール(浮いたブロックはそのまま)</option>
    </select>
    <p class="hint" id="rule-hint"></p>
  </div>

  <div class="field">
    <label for="speed">スピード(落下速度)</label>
    <select id="speed">
      <option value="1000">ゆっくり(初級)</option>
      <option value="600" selected>少し速い(中級)</option>
      <option value="250">速い(上級)</option>
    </select>
    <p class="hint" id="mode-hint"></p>
  </div>

  <div class="field">
    <label for="style">ブロックの柄とサウンド</label>
    <select id="style">
      <option value="normal">普通のブロック(レトロ音)</option>
      <option value="sweets" selected>かわいいスイーツ柄(アニメ風ポップ)</option>
      <option value="neon">光るネオン風(サイバーテクノ)</option>
    </select>
    <canvas id="preview" aria-label="選んだ柄のブロック見本"></canvas>
  </div>

  <button id="start-btn" class="primary">ゲームスタート</button>

  <section class="records">
    <h2>あなたの個人記録(<span id="rec-rule"></span>)</h2>
    <dl>
      <dt>無限(一定)の最高スコア</dt><dd id="rec-inf">0</dd>
      <dt>無限(加速)の最高スコア</dt><dd id="rec-acc">0</dd>
      <dt>ステージ最高</dt><dd id="rec-stg">ステージ 1</dd>
    </dl>
  </section>
  <p class="note">スタートを押すと音声がオンになります。スマホは縦向きでも横向きでも遊べます。操作は画面のどこでも、タップで回転、左右になぞって移動、下になぞって落下(素早くはじくと一気に落下)です。HOLDの枠をタップするとホールドします。パソコンでは ← → 移動、↑ 回転、↓ 落下、Space 即落下、C ホールド、P 中断です。</p>
</main>

<main id="game" hidden>
  <header class="topbar">
    <button type="button" class="box" id="hold-box" aria-label="ホールド(タップで入れ替え)"><span class="lbl">HOLD</span><canvas id="hold-canvas"></canvas></button>
    <div class="stats">
      <div class="stat wide"><span class="lbl">SCORE</span><b id="score">0</b></div>
      <div class="stat" id="lines-stat"><span class="lbl">LINES</span><b id="lines">0</b></div>
      <div class="stat" id="stage-stat" hidden><span class="lbl" id="stage-lbl">STAGE</span><b id="stage">1</b></div>
    </div>
    <div class="box" id="next-box"><span class="lbl">NEXT</span><canvas id="next-canvas" aria-label="次に来るブロック3つ"></canvas></div>
  </header>

  <div class="subbar">
    <span id="mode-label"></span>
    <span class="tools">
      <button class="tool" id="mute-btn" type="button">音 ON</button>
      <button class="tool" id="pause-btn" type="button">中断</button>
    </span>
  </div>

  <div class="board-wrap" id="board-wrap"><canvas id="board"></canvas></div>


  <div id="overlay" hidden>
    <h2 id="ov-title">GAME OVER</h2>
    <p id="ov-score">スコア <b id="ov-score-val">0</b></p>
    <p id="ov-sub"></p>
    <div id="ov-btns"></div>
  </div>
</main>

  /* ======================= キャンバスの準備 ======================= */
  function setupCanvas(cv, lw, lh, cssW, cssH) {

  let bctx = null, hctx = null, nctx = null;
  const LAND = '(orientation: landscape) and (max-height: 560px)';
  function fitBoard() {
    const wrap = $('board-wrap'), g = $('game');
    let cell;

      if (g.clientHeight <= 0) return;
      const byH = Math.floor((g.clientHeight - 6) / ROWS);
      const byW = Math.floor((g.clientWidth - 340 - 6) / COLS);
      cell = Math.max(8, Math.min(byH, byW));

      wrap.style.height = (cell * ROWS + 6) + 'px';
    } else {
      wrap.style.width = ''; wrap.style.height = '';

  nctx = setupCanvas(nextCv, 64, 66, 64, 66);

  function drawMini(c, t, dim) {
    c.clearRect(0, 0, 100, 100);
    if (!t) return;
    const m = PIECES[t];
    let minX = 9, maxX = -1, minY = 9, maxY = -1;
    m.forEach((row, y) => row.forEach((v, x) => { if (v) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); } }));
    const s = 20, w = (maxX - minX + 1) * s, h = (maxY - minY + 1) * s;
    const ox = (100 - w) / 2 - minX * s, oy = (100 - h) / 2 - minY * s;

    m.forEach((row, y) => row.forEach((v, x) => { if (v) drawCell(c, style, t, ox + x * s, oy + y * s, s); }));

  }
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const NEXT_SLOTS = [{ y0: 0, y1: 24, s: 11, a: 1 }, { y0: 24, y1: 45, s: 9, a: 0.85 }, { y0: 45, y1: 66, s: 9, a: 0.7 }];
  function drawNextQueue() {
    const c = nctx;
    c.clearRect(0, 0, 64, 66);

      const pt = nextQ && nextQ[i];
      if (!pt) return;
      const m = PIECES[pt];
      let minX = 9, maxX = -1, minY = 9, maxY = -1;
      m.forEach((row, y) => row.forEach((v, x) => { if (v) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); } }));
      const s = sl.s, w = (maxX - minX + 1) * s, h = (maxY - minY + 1) * s;

  // HOLDが空のあいだは「タップでホールド」の文字を出す(枠の点線はボタン側で出している)

  /* ======================= ゲームの状態 ======================= */
  let style = 'sweets', mode = 'infinite', base = 600;

  // 記録はルール(ストン落下 / 通常)ごとに分けて残す。以前の形式の記録は、初期設定だったストン落下の記録として引き継ぐ
  const KEY = 'superCustomTetrisRecords';

  function loadRec() {

      if (r && typeof r === 'object') {
        if (r.gravity || r.classic) {
          ['gravity', 'classic'].forEach((k) => { if (r[k]) d[k] = Object.assign(blankRec(), r[k]); });
        } else d.gravity = Object.assign(blankRec(), r);

    return d;
  }
  const rec = loadRec();
  const recOf = () => rec[rule] || rec.gravity; // 遊んでいるルールの記録
  function saveRec() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) { /* 無視 */ } }
  // 設定画面では、いま選んでいるルールの記録を見せる
  function refreshRecords() {
    const k = $('rule').value, r = rec[k] || rec.gravity;
    $('rec-rule').textContent = RULE_NAMES[k] || '';

    $('rec-acc').textContent = r.acc;

  }
  const emptyBoard = () => Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  function pullBag() {
    if (!bag.length) {

  function rotM(m, dir) {
    const n = m.length;

  }

  // 揃った列を消す。ストン落下ルールなら、消えたあとに浮いたブロックを落として、もう一度判定する(連鎖)

  /* ======================= 画面の切り替え ======================= */

  function showOverlay(o) {

    base = parseInt($('speed').value, 10);
    setStyle($('style').value);
    board = emptyBoard(); bag = []; particles = [];
    score = 0; lines = 0; level = 1; stage = 1; stageLines = 0;
    hold = null; canHold = true; nextQ = [pullBag(), pullBag(), pullBag()];
    $('setup').hidden = true; $('game').hidden = false;
    hideOverlay();
    fitBoard();
    updateHud();
    state = 'playing';
    if (spawn()) updateMinis();
    bgmIdx = 0; startBgm();
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function toSetup() {
    state = 'idle';
    stopBgm();
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    hideOverlay();
    $('game').hidden = true; $('setup').hidden = false;
    refreshRecords();
    drawPreview();
  }
  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    stopBgm();
    showOverlay({ title: '中断中', showScore: true, buttons: [
      { label: '再開', primary: true, fn: resumeGame },
      { label: '設定に戻る', fn: toSetup }
    ] });
  }
  function resumeGame() {
    if (state !== 'paused') return;
    hideOverlay();
    state = 'playing';
    initAudio(); startBgm();
    last = performance.now();
  }
  function gameOver() {
    state = 'overlay';
    stopBgm(); se('over');
    let sub;
    if (mode === 'stage') sub = 'ステージ ' + stage + ' で終了';
    else {
      const k = mode === 'accel' ? 'acc' : 'inf', R = recOf();
      if (score > R[k]) { R[k] = score; saveRec(); sub = 'ハイスコア更新!'; }
      else sub = '最高スコア ' + R[k];
    }
    refreshRecords();
    showOverlay({ title: 'GAME OVER', showScore: true, sub: sub, buttons: [
      { label: 'もう一度プレイ', primary: true, fn: startGame },
      { label: '設定に戻る', fn: toSetup }
    ] });
  }
  function stageClear() {
    state = 'overlay';
    se('stage');
    if (stage >= STAGES) {
      recOf().stage = STAGES + 1; saveRec(); refreshRecords();
      showOverlay({ title: 'ALL CLEAR!', showScore: true, sub: '全' + STAGES + 'ステージをクリアしました', buttons: [
        { label: 'もう一度プレイ', primary: true, fn: startGame },
        { label: '設定に戻る', fn: toSetup }
      ] });
      return;
    }
    showOverlay({ title: 'STAGE ' + stage + ' CLEAR!', showScore: true, sub: '次はスピードアップ', buttons: [
      { label: '次のステージへ', primary: true, fn: nextStage },
      { label: '設定に戻る', fn: toSetup }
    ] });
  }
  function nextStage() {
    stage++; stageLines = 0;
    if (recOf().stage < stage) { recOf().stage = stage; saveRec(); }
    board = emptyBoard();
    hideOverlay();
    updateHud();
    state = 'playing';
    if (spawn()) updateMinis();
    last = performance.now();
  }

  /* ======================= 設定画面 ======================= */
  const HINTS = {
    infinite: 'ずっと同じ速さで続きます。',
    accel: '10ライン消すごとに、少しずつ速くなります。',
    stage: '各ステージ10ラインでクリア。進むほど速くなります。'
  };
  function drawPreview() {
    const cv = $('preview');
    const w = Math.min(266, cv.parentElement.clientWidth || 266);
    const cs = Math.max(16, Math.floor(w / 7));
    const c = setupCanvas(cv, cs * 7, cs, cs * 7, cs);
    TYPES.forEach((t, i) => drawCell(c, style, t, i * cs + cs * 0.06, cs * 0.04, cs * 0.9));
  }
  const RULE_HINTS = {
    gravity: 'ラインが消えたあと、宙に浮いたブロックがストンと落ちます。落ちた先で揃うと連鎖して高得点です。',
    classic: '標準のルールです。上のブロックは、消えた行の分だけ下がります。'
  };
  $('rule').addEventListener('change', () => { $('rule-hint').textContent = RULE_HINTS[$('rule').value]; refreshRecords(); });
  $('mode').addEventListener('change', () => { $('mode-hint').textContent = HINTS[$('mode').value]; });
  $('style').addEventListener('change', () => { setStyle($('style').value); drawPreview(); });
  $('start-btn').addEventListener('click', startGame);
  $('pause-btn').addEventListener('click', pauseGame);
  $('mute-btn').addEventListener('click', () => {
    muted = !muted;
    $('mute-btn').textContent = muted ? '音 OFF' : '音 ON';
    if (!muted) initAudio();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

  /* ======================= 操作 ======================= */
  // タッチ操作(ボタン以外は画面のどこでも。横向きでも、盤面の左右の余白で操作できる)
  //  タップ: 回転 / 左右になぞる: 移動 / 下になぞる: 指に合わせて落ちる / 下へ素早くはじく: 一気に落下
  const wrapEl = $('game');
  let gest = null;
  wrapEl.addEventListener('pointerdown', (e) => {
    if (state !== 'playing') return;
    if (e.target.closest && e.target.closest('button')) return;
    initAudio();
    gest = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ax: e.clientX, ay: e.clientY, t0: performance.now(), axis: '', moved: false };
    try { wrapEl.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
    e.preventDefault();
  });
  wrapEl.addEventListener('pointermove', (e) => {
    if (!gest || e.pointerId !== gest.id || state !== 'playing') return;
    const cell = Math.max(12, boardCv.clientWidth / COLS);
    if (!gest.axis) {
      const dx = e.clientX - gest.sx, dy = e.clientY - gest.sy;
      if (Math.hypot(dx, dy) < 10) return;
      gest.moved = true;
      gest.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : (dy > 0 ? 'y' : 'none');
    }
    if (gest.axis === 'x') {
      const step = cell * 0.9;
      let d = e.clientX - gest.ax;
      while (Math.abs(d) >= step) {
        const s = d > 0 ? 1 : -1;
        move(s);
        gest.ax += s * step;
        d = e.clientX - gest.ax;
      }
    } else if (gest.axis === 'y') {
      const step = cell * 0.8;
      let d = e.clientY - gest.ay;
      while (d >= step) {
        softStep();
        gest.ay += step;
        d = e.clientY - gest.ay;
      }
    }
  });
  function endGesture(e) {
    if (!gest || e.pointerId !== gest.id) return;
    const g = gest;
    gest = null;
    if (e.type === 'pointercancel' || state !== 'playing') return;
    const dt = performance.now() - g.t0;
    if (!g.moved) { if (dt < 400) rotate(1); return; }
    if (g.axis === 'y') {
      const cell = Math.max(12, boardCv.clientWidth / COLS);
      if (e.clientY - g.sy > cell * 3 && dt < 280) hardDrop();
    }
  }
  wrapEl.addEventListener('pointerup', endGesture);
  wrapEl.addEventListener('pointercancel', endGesture);
  $('hold-box').addEventListener('click', () => { initAudio(); holdPiece(); });

  document.addEventListener('keydown', (e) => {
    if (state === 'paused' && (e.code === 'KeyP' || e.code === 'Escape')) { resumeGame(); e.preventDefault(); return; }
    if (state !== 'playing') return;
    switch (e.code) {
      case 'ArrowLeft': move(-1); break;
      case 'ArrowRight': move(1); break;
      case 'ArrowDown': softStep(); break;
      case 'ArrowUp': case 'KeyX': rotate(1); break;
      case 'KeyZ': rotate(-1); break;
      case 'Space': hardDrop(); break;
      case 'KeyC': case 'ShiftLeft': case 'ShiftRight': holdPiece(); break;
      case 'KeyP': case 'Escape': pauseGame(); break;
      default: return;
    }
    e.preventDefault();
  });

  /* ======================= 起動 ======================= */
  setStyle($('style').value);
  $('mode-hint').textContent = HINTS.infinite;
  $('rule-hint').textContent = RULE_HINTS.gravity;
  refreshRecords();
  drawPreview();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawPreview);
})();
</script>
